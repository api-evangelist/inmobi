notes: >-
  Re-probed on 2026-08-12 across ALL SIX InMobi hosts now known to this profile,
  including the three API hosts discovered this round. Nothing is served. Not one
  path on not one host returns a document — no security.txt, no OIDC or OAuth
  discovery, no api-catalog, no ai-plugin.json, and no A2A agent card at either
  the current /.well-known/agent-card.json or the legacy /.well-known/agent.json
  path.
  TWO FAILURE SHAPES WORTH DISTINGUISHING:
  (1) www.inmobi.com, support.inmobi.com and advertising.inmobi.com return an
  honest 404 — but with an HTML body, so a 200 on any of these hosts would need
  content inspection before being trusted.
  (2) api.inmobi.com and publisher.inmobi.com return HTTP 302 to
  https://dummy.blacklisted.host/<path> for every unrouted path, and
  api.cdr.inmobi.com returns 403 for everything. These are edge blackholes: a
  discovery client never receives a 404, it receives a redirect to a
  non-resolving sink or a blanket forbidden. That defeats automated contract
  discovery on exactly the hosts that serve the real APIs.
  NO WellKnown OR SecurityTxt POINTER IS EMITTED IN apis.yml — this file records
  an absence, and an absence must never be wired as a presence.
