generated: '2026-08-12'
method: probed
source: >-
  live unauthenticated responses from https://api.inmobi.com/v3.0/reporting/publisher
  and https://publisher.inmobi.com/rest/api/v2/apps (2026-08-12) , plus
  https://support.inmobi.com/monetize/inmobi-apis/ad-management-api/api-details ,
  https://support.inmobi.com/monetize/inmobi-apis/reporting-api
notes: >-
  InMobi returns draft-standard RateLimit-* response headers on its API hosts —
  a genuinely useful runtime signal and better than most ad-tech peers. The
  headers were read from live anonymous requests, so the values below are
  observed, not quoted. NOTE A DISCREPANCY: the Ad Management API docs state
  "500 requests in an interval of 15 minutes", but the live edge advertises
  `ratelimit-policy: 1500;w=900` (1500 requests per 900 seconds) on the same
  host. Both numbers are recorded; the documented figure is likely the
  application-tier quota and the header the edge-tier quota.
limit_count: 4

response_headers:
  observed: true
  style: IETF draft ratelimit-headers (lowercase, non-prefixed)
  headers:
  - name: ratelimit-policy
    example: 1500;w=900
    description: Quota and window advertised by the edge (1500 requests per 900-second window).
  - name: ratelimit-limit
    example: '1500'
    description: Requests permitted in the current window.
  - name: ratelimit-remaining
    example: '1496'
    description: Requests left in the current window.
  - name: ratelimit-reset
    example: '618'
    description: Seconds until the window resets.
  retry_after: not observed
  exhaustion_status: not observed (quota not exhausted during probing); no 429 semantics documented
  note: >-
    No X-RateLimit-* variants and no Retry-After were returned. The RFC 9457
    problem+json media type is not used on any error response.

