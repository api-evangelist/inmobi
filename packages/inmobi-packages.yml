notes: >-
  InMobi distributes native mobile ad SDKs, not REST API client libraries. The
  Android SDK ships on Maven Central; the iOS SDK ships on CocoaPods and Swift
  Package Manager. There is NO first-party client library for any of InMobi's
  four REST APIs (Publisher Reporting, Ad Management, DSP Cost,
  Server-to-Server Ad Request) in any language — callers hand-roll HTTP. Nothing
  is published to npm, PyPI, RubyGems, NuGet, crates.io or pkg.go.dev (all
  probed 404 on 2026-08-12).
  CURRENCY: the two flagship ad SDKs are current and shipping in lockstep
  (Android 11.4.0 on 2026-07-08, iOS 11.4.1 on 2026-08-05). The decay is in the
  older layer — the legacy Java artifact stopped at 10.1.4 in Sept 2023, and the
  only first-party SERVER-side library InMobi ever published,
  github.com/InMobi/api-monetization, has not been pushed since Feb 2016.
