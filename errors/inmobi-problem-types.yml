notes: >-
  InMobi does not use RFC 9457 problem+json. Each of its three REST APIs ships a
  DIFFERENT error envelope, and the envelopes disagree on both the wrapper key
  and the code type — a numeric integer code on the Reporting API, a bracketed
  string slug on the Ad Management API, and a dotted string slug on the DSP Cost
  API. Every envelope shape below was confirmed against a live unauthenticated
  request, not just read from the docs. Error names/remediation come from the
  provider's published error tables.

