aid: inmobi
name: InMobi
description: 'InMobi is a global advertising technology and mobile marketing platform
  headquartered in Bengaluru, India, and backed by SoftBank Vision Fund. It positions
  itself as the intelligence layer of the consumer internet, connecting brands and
  consumers across mobile apps and the open web. InMobi''s enterprise platforms include
  InMobi Advertising for brand building, app growth and ad monetization; the InMobi
  Exchange, a programmatic OpenRTB 2.5 ad exchange for demand-side platforms; InMobi
  DSP performance solutions; and InMobi CMP (Choice), an IAB TCF-certified consent
  management platform. InMobi operates four documented, live REST APIs — the Publisher
  Reporting API 3.0 for inventory performance data, the Ad Management API for managing
  apps and placements, the DSP Cost API for asynchronous spend reporting, and a
  Server-to-Server Ad Request API — alongside native mobile ad SDKs for Android (Maven
  Central) and iOS (CocoaPods and Swift Package Manager). No OpenAPI, AsyncAPI, OAuth
  server or REST client library is published for any of them. Consumer brands include
  Glance and the 1Weather app.'
