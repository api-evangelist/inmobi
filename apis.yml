aid: inmobi
name: InMobi
description: 'InMobi is a global advertising technology and mobile marketing platform
  headquartered in Bengaluru, India, and backed by SoftBank Vision Fund. It positions
  itself as the intelligence layer of the consumer internet, connecting brands and
  consumers across mobile apps and the open web. InMobi''s enterprise platforms include
  InMobi Advertising for brand building, app growth and ad monetization; the InMobi
  Exchange, a programmatic OpenRTB ad exchange for demand-side platforms; InMobi DSP
  performance solutions; and InMobi Choice, an IAB TCF-certified consent management
  platform (CMP). InMobi ships native mobile ad SDKs for Android (Maven Central) and
  iOS (CocoaPods and Swift Package Manager) rather than a public REST API, and integrates
  with mediation platforms such as AppLovin MAX, Google Mobile Ads, and IronSource.
  Consumer brands include Glance and the 1Weather app.'
